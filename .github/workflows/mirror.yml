name: Mirror to Forgejo

on:
  schedule:
    # Run every day at 1 pm
    - cron: '0 13 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream
        run: |
          if [ ! -d upstream ]; then
            git clone --mirror https://github.com/StellarwhimsRepo/FLSR.git upstream
          else
            cd upstream
            git fetch --all
          fi
          cd upstream
          git remote add target https://StellarWhimsRepo:${{ secrets.FLSR_FORGJOMIRROR_PAT }}@forgejo.stellarwhims.com/freelancer-sirius-revival/FLSR.git
          git push target --mirror
